    note: "文档内部不一致：ADR-012 写 {role}_{slideId}_{localIndex}，LAY-08 写 {type}_{slideId}_{idx}，现有 autoFixProject 用 {type}_{slideId}_{eIdx}。不自行裁决；因两条候选规则都满足『含 slideId』与『全局唯一』，SPEC-CORE-003/004 的验收判据不受该冲突影响，故不阻塞任何条款。"

  - id: CONF-002
