  - id: AMB-002
    topic: 越界判定依据画布还是安全区
    clause_ref: SPEC-QLT-004
    question: "LAY-05 说「内容区 100px 边距、底部 1020px；元素不得越界」，而质量引擎按 1920×1080 画布判定越界。以哪一个为准？"
    impact: none
    blocks: []
    proposed_default: "两者并存且不矛盾：画布判定用于质量扣分（现状，已被 F7 追认），安全区用于版式生成的布局约束（LAY-05）。本 Spec 按此解读记录为 DEC-002。"
