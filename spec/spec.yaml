# AI PPT Studio · 可执行规格（Design Spec）
# ---------------------------------------------------------------------------
# 本文件由 .claude/skills/design-spec 的流程产出，是 docs/ 下五份设计文档的
# 机器可读契约层。校验：spec/verify/spec-schema.py（JSON Schema 2020-12）
#
# 维护约定：
#   · 条款编号一旦发布不再重排；废弃条款标 status: withdrawn 并写明原因
#   · source.quote 必须是原文摘录，便于逐条复核
#   · 判据必须可机械执行；Oracle 必须来自被测系统之外
#   · maturity: planned = 判据已定义，验证器尚未建成（不等于"已通过"）
#   · maturity: automated = 判据已有**可执行**的验证器；是否通过看追溯矩阵的结论列
#   · 命令一律写成 `bun test ./<路径>` —— 不带 `./` 会被 Bun 当成**过滤器**，
#     对不匹配默认测试规则的文件（*.bench.ts / *.check.ts / *.e2e.ts）
#     会打印 "filters did not match any test files" 而一个用例都跑不到
# ---------------------------------------------------------------------------

meta:
  spec_version: "1.0"
  title: "AI PPT Studio · 可执行规格"
  owner: "待指派"
  created_at: "2026-11-01"
  last_reviewed: "2026-11-01"
  sources:
    - doc: "docs/backend-design.md"
      version: "2026-11-01"
      role: primary
    - doc: "docs/backend-features.md"
      version: "2026-11-01"
      role: primary
    - doc: "docs/architecture.md"
      version: "2026-11-01"
      role: primary
    - doc: "docs/testing-strategy.md"
      version: "2026-11-01"
      role: supplementary
    - doc: "docs/test-cases.md"
      version: "2026-11-01"
      role: supplementary

conventions:
  error_shape:
    - "所有 4xx/5xx 响应体为 { error: { code, message, details? }, traceId }"
  success_shape:
    - "所有成功响应体为 { data: <T>, traceId: 'req_xxx' }"
  id_scheme:
    - "项目: proj_<entity>_<seq>"
    - "幻灯片: slide_<entity>_<seq>"
    - "元素: {prefix}_{slideId}_{localIndex}（prefix 取值见 CONF-001）"
  numeric_boundaries:
    - "画布尺寸固定 1920×1080"
    - "安全区：左/右 100px，上 60px，下 1020px"
    - "元素最小宽 200px、最小高 100px"
    - "质量分权重：结构 0.3 / 视觉 0.3 / 内容 0.2 / 一致性 0.2"
    - "卡片 AABB 碰撞缓冲 10px"

# ===========================================================================
# A. 领域内核 —— 版式与内容绑定
# ===========================================================================
clauses:

  # ---- SPEC-CORE-001 画布尺寸 ----
  - id: SPEC-CORE-001
    title: 画布尺寸恒为 1920×1080
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "layoutEngine 产出的每一页 SlideIR，其 canvas 必须恒为 { width: 1920, height: 1080 }"
    source:
      doc: "docs/backend-design.md"
      section: "§7.2 各格式实现"
      quote: "| **PDF** | `pdf-lib` + resvg 位图嵌入 | 每页 1920×1080 → 嵌入 A4/16:9 页；中文由 resvg 渲染成位图，**不依赖阅读器字体** |"
    preconditions:
      - "传入的 outline 与 theme 合法"
    behaviors:
      - when: "任意 layoutPreference、任意主题"
        then: "返回的 SlideIR.canvas 深度相等 { width: 1920, height: 1080 }"
    boundaries:
      - "LAY-09 提到未来要支持 4:3 比例缩放，那是 S2 阶段的独立变更，不改变本条当前的硬编码事实"
    acceptance:
      - id: AC-CORE-001
        criterion: "对 8 种版式 × 8 套主题共 64 组输入调用 LayoutEngine.generateSlideIR，断言每组的 slide.canvas 严格等于 { width: 1920, height: 1080 }"
        oracle:
          tier: authoritative
          source: "docs/backend-design.md §7.2 —— 每页 1920×1080"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::canvas-is-always-1920x1080"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated
      # 画布"是 1920×1080"这件事，光看 IR 不够 —— IR 是 1920×1080，
      # 渲染到屏幕上时也可能被挤成别的比例（2026-11-04 实测：flex-shrink 把
      # 画布压成 480×1080 的竖条，幻灯片被缩成中间一条，上下大片空白）。
      # 这一条守的是**屏幕上的实际盒子**。
      - id: AC-CORE-011
        criterion: "在真实浏览器里打开工作台，断言 `[data-testid=slide-canvas]` 元素盒的宽高比等于 16:9（误差 ≤ 2%）、SVG 的 viewBox 比例等于 16:9（误差 ≤ 2%），且幻灯片那层整幅背景（SVG 里覆盖 0,0,1920,1080 的 rect）的屏幕包围盒与画布盒重合（宽高各 ≥ 98% 且 ≤ 102%，左上角偏差 ≤ 2px）—— 即幻灯片铺满画布，不存在信箱边"
        oracle:
          tier: formal
          source: "docs/backend-design.md §7.2 —— 每页 1920×1080 ⇒ 16:9；viewBox 比例与元素盒比例一致时，preserveAspectRatio=\"xMidYMid meet\" 必然铺满整个盒子（形式化推论，非新增业务规则）"
          confidence: high
        verification:
          kind: test
          target: "e2e/workbench.e2e.ts::AC-CORE-011 工作台画布在屏幕上保持 16:9，不出现信箱边"
          command: "bun test ./e2e/workbench.e2e.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-002 元素不越界 ----
  - id: SPEC-CORE-002
    title: 版式元素不得越出画布
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "layoutEngine 产出的任何非 background 元素，其几何必须完整落在 1920×1080 画布内"
    source:
      doc: "docs/backend-features.md"
      section: "§E 版式与内容绑定（LAY）· LAY-05"
      quote: "内容区 100px 边距、底部 1020px；元素不得越界"
    preconditions:
      - "canvas 为 1920×1080"
    behaviors:
      - when: "生成任意版式"
        then: "所有 role != 'background' 的元素满足 0 ≤ x 且 0 ≤ y 且 x+width ≤ 1920 且 y+height ≤ 1080"
    boundaries:
      - "background 元素（bg_*）天然铺满画布，显式豁免"
    acceptance:
      - id: AC-CORE-002
        criterion: "对 8 种版式 × 8 套主题共 64 组输入，收集全部非 background 元素，断言无任何元素满足 x < 0 或 y < 0 或 x+width > 1920 或 y+height > 1080"
        oracle:
          tier: authoritative
          source: "docs/backend-features.md §E LAY-05 —— 元素不得越界"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::no-element-out-of-canvas"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-003 元素 ID 全局唯一 ----
  - id: SPEC-CORE-003
    title: 元素 ID 在整个项目内全局唯一
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "同一项目内所有页面的所有元素 ID 必须两两不同"
    source:
      doc: "docs/architecture.md"
      section: "§12 ADR-012 · 版式专属元素 ID 统一加 slideId 前缀"
      quote: "**决策**：`@ppt/core` 生成的所有元素 ID 形如 `{role}_{slideId}_{localIndex}`，全局唯一是**契约**而非巧合。"
    derived_from: SPEC-CORE-004
    inference: "ADR-012 明确『全局唯一是契约而非巧合』；既然 ID 含 slideId，唯一性即为其推论"
    behaviors:
      - when: "一个项目包含多页，且其中两页使用相同版式"
        then: "两页的版式专属元素 ID 不得相同"
    acceptance:
      - id: AC-CORE-003
        criterion: "构造一个含 6 页、其中 2 页同为 cards_grid 版式的项目，收集全部元素的 id，断言集合基数等于数组长度"
        oracle:
          tier: formal
          source: "ID 全局唯一性不变量 —— ADR-012『全局唯一是契约而非巧合』"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::element-ids-unique-across-slides"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-004 版式专属 ID 必须含 slideId ----
  - id: SPEC-CORE-004
    title: 版式专属元素 ID 必须携带 slideId
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "所有由版式专属逻辑生成的元素 ID 必须包含所属幻灯片的 slideId"
    source:
      doc: "docs/architecture.md"
      section: "§12 ADR-012 · 版式专属元素 ID 统一加 slideId 前缀"
      quote: "**背景**：现状 `grid_card_0` / `kpi_card_0` / `problem_box` 等版式元素 ID **不含 slideId**，同版式出现在两页时 ID 完全重复 —— 质量引擎跨页累积扣分（structure -5/次），且\"精准编辑\"按 elementId 定位会命中错误页的元素。"
    conflict: CONF-001
    behaviors:
      - when: "同一版式出现在两页"
        then: "两页生成的同名版式元素 ID 仍彼此不同"
    acceptance:
      - id: AC-CORE-004
        criterion: "对 8 种版式，断言该版式生成的每一个元素 ID 都包含该页的 slideId 字符串"
        oracle:
          tier: authoritative
          source: "docs/architecture.md §12 ADR-012 —— 决策：所有元素 ID 形如 {role}_{slideId}_{localIndex}"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::layout-element-ids-contain-slide-id"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-005 版式引擎是纯函数 ----
  - id: SPEC-CORE-005
    title: 版式引擎是纯函数，同输入必得同输出
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "在剥离 versionId 与 lastModified 两个非确定性字段后，相同输入必须产出逐字段相同的 SlideIR"
    source:
      doc: "docs/architecture.md"
      section: "§13 QA-4 · 可维护：版式引擎变更不引入静默回归"
      quote: "**架构响应**：① 64 组黄金快照测试进 CI ② 版式是纯函数无隐藏状态 ③ 快照 diff 需人工审阅。"
    behaviors:
      - when: "连续两次用同一份 outline + theme 调用 generateSlideIR"
        then: "剥离 versionId / lastModified 后，两次结果深度相等"
    acceptance:
      - id: AC-CORE-005
        criterion: "对 8 种版式 × 8 套主题共 64 组输入各调用两次 generateSlideIR，剥离 versionId 与 lastModified 后断言两次结果深度相等"
        oracle:
          tier: formal
          source: "docs/architecture.md §13 QA-4 —— 版式是纯函数无隐藏状态"
          confidence: high
        verification:
          kind: property
          target: "spec/verify/core-layout.test.ts::layout-engine-is-pure"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-006 封面不渲染母版 ----
  - id: SPEC-CORE-006
    title: 封面页不渲染母版元素
    type: technical
    risk: medium
    status: active
    maturity: automated
    statement: "layoutPreference 为 title_cover 的页面不得包含页眉、页脚、页码类母版元素"
    source:
      doc: "docs/backend-features.md"
      section: "§E 版式与内容绑定（LAY）· LAY-07"
      quote: "页眉 kicker、页脚机密声明、页码 `NN / TT`；封面页不渲染母版"
    acceptance:
      - id: AC-CORE-006
        criterion: "生成一页 title_cover，断言其元素中不含 id 以 header_ / pagenum_ / footernote_ 开头的元素"
        oracle:
          tier: authoritative
          source: "docs/backend-features.md §E LAY-07 —— 封面页不渲染母版"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::cover-page-has-no-master-elements"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-007 页码格式 ----
  - id: SPEC-CORE-007
    title: 页码格式为 NN / TT
    type: technical
    risk: low
    status: active
    maturity: automated
    statement: "非封面页的页码元素内容必须形如 两位序号 / 两位总数"
    source:
      doc: "docs/backend-features.md"
      section: "§E 版式与内容绑定（LAY）· LAY-07"
      quote: "页眉 kicker、页脚机密声明、页码 `NN / TT`；封面页不渲染母版"
    boundaries:
      - "序号与总数均补零到两位：第 1 页共 12 页 → '01 / 12'"
    acceptance:
      - id: AC-CORE-007
        criterion: "生成第 3 页 / 共 12 页，断言 id 为 pagenum_<slideId> 的元素内容严格等于 '03 / 12'"
        oracle:
          tier: authoritative
          source: "docs/backend-features.md §E LAY-07 —— 页码 NN / TT"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-layout.test.ts::page-number-format"
          command: "bun test ./spec/verify/core-layout.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-008 版式内容不得硬编码 ----
  - id: SPEC-CORE-008
    title: 版式渲染内容不得回落到硬编码演示文案
    type: business
    risk: high
    status: active
    maturity: automated
    statement: "对任意版式，渲染出的元素内容必须来自该页的大纲内容，不得回落到与输入无关的固定演示文案"
    source:
      doc: "docs/backend-features.md"
      section: "§E 版式与内容绑定（LAY）· LAY-02"
      quote: "`bindContent(outline, content)`：缺失槽位从 `outline.bulletPoints` 推导。**任何路径都不得回落到硬编码演示文案**（修复当前 7/8 版式硬编码缺陷）"
    derived_from: SPEC-CORE-003
    inference: "F2 认定『只有 cards_grid 使用了 outline.bulletPoints，其余 7 种内容全部硬编码』；LAY-02 是对应的修复要求，故本条为待建目标而非现状描述"
    behaviors:
      - when: "给版式传入一组专属的 bulletPoints"
        then: "渲染结果中必须出现这些要点文本"
      - when: "给版式传入另一组完全不同的 bulletPoints"
        then: "渲染结果中不得出现上一组的内容"
    boundaries:
      - "槽位映射表规定：title_cover 消费 title/subtitle/meta，不消费 bullets；其余 7 种版式均消费 bullets"
    acceptance:
      - id: AC-CORE-008
        criterion: "对 architecture_diagram / cards_grid / problem_solution / timeline_roadmap / stats_kpi / radial_center / summary_conclusion 七种版式各生成一页，其 bulletPoints 使用互不相同、且不可能出现在任何硬编码演示文案中的专属标记串；断言该页全部元素的字符串内容（含结构化 content 内的所有字符串字段与数组元素）中都出现该页 bulletPoints 的每一条标记文本"
        oracle:
          tier: authoritative
          source: "docs/backend-design.md §4.2 版式↔槽位映射表 —— 7 种版式的缺省降级均由 bullets 推导；docs/backend-features.md §E LAY-02"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-content.test.ts::bullet-consuming-layouts-use-outline-bullets"
          command: "bun test ./spec/verify/core-content.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated
      - id: AC-CORE-009
        criterion: "生成一页 title_cover（purpose 非空），断言其全部元素的非空字符串内容都能追溯到该页 outline 的字段值（outline.title / outline.purpose / outline.keyMessage / outline.visualIntent / outline.speakerNotes / outline.bulletPoints），即不存在任何与 outline 无关的固定演示文案"
        oracle:
          tier: authoritative
          source: "docs/backend-features.md §E LAY-02 —— 任何路径都不得回落到硬编码演示文案"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-content.test.ts::cover-content-traceable-to-outline"
          command: "bun test ./spec/verify/core-content.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated
      - id: AC-CORE-010
        criterion: "对 7 种消费 bullets 的版式：用要点集 A 渲染得到内容集 C_A，用与 A 不相交的要点集 B 渲染得到内容集 C_B；断言 C_A 与 C_B 不相等（渲染结果确实随输入改变），且 C_B 中不出现 A 的任何要点文本"
        oracle:
          tier: authoritative
          source: "docs/backend-features.md §E LAY-02 —— 不得回落到硬编码演示文案"
          confidence: high
        verification:
          kind: test
          target: "spec/verify/core-content.test.ts::render-output-follows-outline-bullets"
          command: "bun test ./spec/verify/core-content.test.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

  # ---- SPEC-CORE-009 工作台画布必须完整可见且完整可达 ----
  - id: SPEC-CORE-009
    title: 工作台画布必须完整可见、完整可达
    type: business
    risk: high
    status: active
    maturity: automated
    statement: "工作台主画布上的幻灯片必须**完整落在可视区内**，且当用户放大到超出可视区时，超出部分必须**两个方向都滚得到**（不得出现滚不到、看不见、点不着的裁切）"
    source:
      doc: "docs/backend-features.md"
      section: "§F 幻灯片编辑与版本（SLD）· SLD-02 / SLD-04"
      quote: "| SLD-02 | 元素几何更新 | P0 | S1 | 拖拽、方向键微调（步长 1 / Shift 10）持久化 |　| SLD-04 | 元素内容编辑 | P0 | S1 | 文本内容双击编辑后保存；结构化 content（卡片 title/desc）分字段更新 |"
    inference: "SLD-02/SLD-04 要求用户能选中并编辑**任意**元素；元素几何分布在整张 1920×1080 上，因此画布的可见/可达范围必须覆盖整页 —— 否则位于不可达区域的元素既选不中也拖不动，该要求在浏览器上就不成立"
    behaviors:
      - when: "用户在适配缩放档位下查看画布"
        then: "整页幻灯片完整落在可视内容区内，不被裁掉"
      - when: "用户把缩放放大到超出适配档位"
        then: "画布溢出可视区的部分可以滚动到；起始边（左侧/顶部）不被裁掉，末端边（右侧/底部）滚得到"
      - when: "画布容器的尺寸发生变化（窗口缩放、左右面板收起/展开）"
        then: "适配缩放档位重新计算，画布仍完整落在新的可视区内"
    boundaries:
      - "本条只管**浏览器里看得见、够得着**；画布的 IR 尺寸由 SPEC-CORE-001 管"
      - "「放大」本身是用户的主动操作，不要求默认档位下有滚动条"
    acceptance:
      - id: AC-CORE-012
        criterion: "在真实浏览器里打开工作台并把缩放放大到超出适配档位（实测 73%，画布 1402px 宽 > 可视内容区 480px），断言：①滚到最左/最上时画布的左边缘与上边缘落在可视内容区内（偏差 ≤ 1px，即起始边没被裁掉）；②滚到最右/最下时画布的右边缘与下边缘贴住可视内容区的右/下边界（偏差 ≤ 2px）；③滚动行程 scrollWidth-clientWidth ≥ 画布宽-内容区宽-2px（整段溢出都可滚，而不是只有一半）"
        oracle:
          tier: authoritative
