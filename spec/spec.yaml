known_gaps:
  - clause: SPEC-GOV-003
    reason: "AMB-001 未裁决 —— 质量闸门阈值在文档中从未给出，判据本身无法成立"
    plan: "由领域负责人给出阈值后补齐验收判据"

  - clause: SPEC-NFR-001
    reason: "验证器**已建成**（apps/api/tests/perf/outline-latency.bench.ts，100 次采样），但本轮只跑了**降级模式**：模型不可用时采样到的是本地确定性实现，模型往返延迟根本没被采样到。真实模型下的 P95 仍未测过 —— 结论为 INCONCLUSIVE，不能用降级模式的通过顶替"
    plan: "在有真实 GEMINI_API_KEY 的评估环境设 BENCH_REAL_MODEL=1 重跑 `bun test ./apps/api/tests/perf/outline-latency.bench.ts`，把结果并入 spec/evidence/junit.xml"

  - clause: SPEC-E2E-008
    reason: "TPL-03 的**后半段**没实现：docs/backend-features.md 要求「按 role 逐类重映射样式（背景/标题/正文/卡片/徽章/分隔线）」，而 POST /api/templates/:id/apply 目前只把模板**绑定**到项目上，**已经编译好的幻灯片元素样式保持原样** —— 换个模板后画面观感不变。本条款只覆盖「模板绑定落库 + 刷新后仍然生效」（AC-E2E-014 有验证器），元素样式重映射**没有判据、也没有实现**。之所以不直接补：文档没有给出「哪一类 role 映射到哪些具体样式字段」的映射表，layoutEngine 里这些样式是**逐元素内联**写死的（见 packages/core/src/engine/layoutEngine.ts 的 buildXxxLayout），要重映射就得先定出一张映射表 —— 那是替用户定业务规则，违反「不编造业务规则」。"
    plan: "由领域负责人给出 role → 样式字段的映射表（或确认「重映射」就是「按 layoutEngine 现有 role 样式重算」），再在 core 里实现 remapTemplateStyles(elements, theme) 并由 apply 路由写回 slides；届时补 SPEC-E2E-008 的第二条判据"

  - clause: SPEC-E2E-008
    reason: "「失败路径」已由 AC-E2E-020 覆盖（应用不存在的模板 → 界面如实报错 + 服务端模板未被改动）。**仍未覆盖**的是「模板不属于当前用户」这一分支 —— 它与前者共用服务端的同一段 404 处理与前端同一段错误渲染，判据的实质已被 AC-E2E-020 覆盖，但没有独立的用例把「另一个用户的模板」这条路径单独走一遍。"
    plan: "补一条跨租户用例：用户 B 提取一份私有模板，用户 A 在浏览器里尝试应用它，断言 404 + 界面报错 + 服务端模板未被改动"

  - clause: SPEC-E2E-003
    reason: "**页级**编辑（加页 / 复制页 / 删页 / 上移下移）不落库。App.tsx 的 syncProject 有两条硬规则：没有 baseVersionId 的新页直接跳过；剩下页的 IR 一个字节没变就不写。于是删掉的页刷新后会回来、新加的页刷新后会丢。这一条已由 AC-E2E-004（元素级编辑落库）覆盖了实质，但**页级**这条路径至今没有判据 —— 现有用例只能断言界面侧（缩略图数、顺序、画布 data-slide-id），不能断言服务端。"
    plan: "补 POST / DELETE /api/projects/:id/slides 端点，并让 syncProject 在页集合变化时写 order；届时把页级用例从「UI 侧断言」升级为「服务端侧断言」并在本条款补一条判据"

  - clause: SPEC-E2E-008
    reason: "**模板提取**失败没有任何界面提示：TemplateCenter 的 handleSimulateExtract 的 catch 只 console.warn，用户看到的是「点了没反应」。注意这与「应用模板失败」不同 —— 后者已经有 templateNotice（AC-E2E-020 覆盖）；缺提示的是**提取**这一步（上传模板 → 服务端抽取）。"
    plan: "给 TemplateCenter 加一条提取失败的可读提示（复用 sync-notice 那条横幅），届时补一条判据：提取失败时界面明说失败，且服务端模板集未被改动"

  - clause: SPEC-E2E-007
    reason: "作品库的「备份全库」导出的文件**恢复不回来**：它导的是内存里那份摘要列表（每份作品没有 slides、也没有 orderIndex），而导入端 POST /api/projects/import 只认单份作品的形状 {name, slides:[{slideId, orderIndex, ir}]}。两者对不上 —— 单份作品的导出/导入已经修好（走服务端 bundle），但「一次备份整个库」这条路仍然是个死胡同。之所以不直接补：备份文件的**格式**（单份 bundle 的数组？还是 {projects:[...]}？）决定了导入端要不要改契约，那是产品决定，不该由实现侧替用户定。"
    plan: "由产品定下备份文件格式；定了之后让「备份全库」按该格式导出，并让导入端按同一格式读回，补一条「备份 → 清空 → 导入 → 作品库恢复原样」的端到端判据"

  - clause: SPEC-E2E-007
    reason: "作品库里**没打开过**的作品没有封面缩略图：列表接口只回摘要（不含每一页的 IR），前端渲染封面要靠第一页的 IR 画 SVG，于是摘要里 slides 恒为空 → 封面只剩一块模板底色的空框。这与「摘要里补页数 / 模板 id」是同一类问题（摘要信息不足），但补封面需要摘要带第一页的 IR 或服务端生成封面缩略图 —— 后者要给列表接口加一条渲染路径。"
    plan: "给列表摘要补 firstSlide 的 IR（只带第一页，体积可控）或由服务端生成封面缩略图；届时给作品库卡片补一条「封面画的是这一份作品的第一页」的判据"












