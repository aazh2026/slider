    clause_ref: SPEC-GOV-003
    question: "AI 生成内容落库前的质量分阈值 Q 取多少？文档只写「Q ≥ 阈值」与「Q < 阈值 → 降级内容 / 重新生成 / 拒绝并提示」，从未给出数字。"
    impact: correctness
    blocks: [SPEC-GOV-003]
    proposed_default: "建议 Q ≥ 85 且无 error 级 issue —— 但这属于产品决策，需领域负责人拍板，不可由实现方代定"
