  # ---- SPEC-GOV-003 质量闸门阈值 ----
  - id: SPEC-GOV-003
    title: AI 生成内容落库前必须通过质量闸门
    type: governance
    risk: high
    status: blocked
    maturity: none
    statement: "<待 AMB-002 裁决阈值后填写>"
    source:
      doc: "docs/architecture.md"
      section: "§7.3 质量闸门（生成 → 落库的唯一通道）"
      quote: "**闸门是架构组件，不是 UI 功能**。这保证无论内容从哪来（AI 生成、人工导入、模板提取），落库的都是达标内容。"
    conflict: CONF-002
    acceptance: []

