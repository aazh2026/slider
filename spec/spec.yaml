decisions:
  - id: DEC-001
    question: "本次 Spec 拆分是否覆盖全部五份文档的全部章节？"
    decision: "不追求章节级全覆盖，改为领域级全覆盖 + 显式遗漏说明"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "五份文档共 4680 行、626 条测试用例。若按文档章节逐条拆分，得到的 Spec 会与 test-cases.md 高度重复而失去独立价值。改为按 9 个领域拆分 41 条契约，覆盖全部需求类型与风险等级。"
    applies_to: []

  - id: DEC-002
    question: AMB-002
    decision: "画布判定用于质量扣分，安全区用于版式布局约束，两者并存"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "改动任一判定都不会导致做错事（不影响正确性），按 skill 的暂停规则不阻塞；且 docs/backend-design.md §1.2 F7 明确追认质量引擎现状可原样搬到后端。"
    applies_to: [SPEC-QLT-004]

  - id: DEC-003
    question: "AC-EXP-001 的判据单位应该是『IR 字符串』还是『IR 字符串按换行拆出的行』？"
    decision: "改为以『行』为单位，并追加『运行集合与 IR 行集合相等』这一更强的不变式"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "原判据写成『每个 IR 字符串完整出现在某一个 <a:t> 运行里』，但 PPTX 的段落以换行为界 —— pptxgenjs 见到 \\n 必定拆成多个文本对象，DrawingML 的 <a:t> 里也不存在字面换行。这不是实现偷懒，是目标格式的硬约束，原写法对含换行的 IR 字符串**永远不可满足**。若照原样留着，判据要么被悄悄放宽成『包含』而失去反串行能力，要么长期挂着一条永远为假的 FAIL。改为以行为单位后，判据仍可机械判定，且顺带补上了原写法最大的漏洞：只做『包含』判定时，两个 IR 字符串被拼进同一个运行仍会通过（『标题』是『标题正文』的子串）。集合相等同时排除了『缺』（正文丢失）、『多』（凭空固定文案）与『串』（两行拼在一处）。**未降低验收标准**：判据的原始来源（EXP-15/EXP-17『回读产物校验关键文本存在』）未变，收紧的是执行方式，被放宽的只是那个格式上不可能的『一个字符串一个运行』。"
    applies_to: [SPEC-EXP-001]

  - id: DEC-004
    question: "响应包封与业务载荷的边界放哪儿 —— 信封里放什么，业务字段放哪儿？"
    decision: "信封固定为 { data, traceId } 与 { error: { code, message, details? }, traceId }；**data 里再包一层业务字段**（如 { data: { project: {...} } }、{ data: { slides: [...] } }），而不是把业务字段平铺到 data 上"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "docs/backend-design.md §5.3 只规定了信封的形状，没规定 data 内部结构。平铺（{ data: { id, name, ... } }）会让『哪些字段属于业务载荷』变成隐式约定，前端每接一个端点都要重新猜；再包一层（{ data: { project: {...} } }）则把载荷的**名字**显式写出来，新增字段不会破坏契约、删字段也不会悄悄改变语义。代价是前端多一次解构（data.project 而非 data），换来的是可演进的契约。本仓库实现与前端 apiClient 均按此口径。"
    applies_to: [SPEC-API-001, SPEC-API-002, SPEC-API-003, SPEC-API-004, SPEC-API-005]

  - id: DEC-005
    question: "幂等与墓碑：重复施加同一条 remove_element 该报错还是静默成功？"
    decision: "remove_element 指向**不存在**的元素时报错（这是契约错误）；指向**已被删除**的元素时是幂等 no-op —— 通过墓碑（tombstone）集合记录已删除的元素 ID 来区分这两种情况"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "§4.3 只写了『删不存在则报错而非静默』，没有区分『从来没存在过』与『已经被删掉了』。若两者都报错，重试机制（网络超时后重发同一条补丁）会永远失败；若两者都静默，契约错误会被彻底吞掉。墓碑是唯一能同时满足两者的机制：删除时把元素 ID 记入墓碑；施加时先查墓碑（命中 → 幂等 no-op），再查元素表（未命中 → 抛错）。墓碑随 SlideIR 版本一起保存，因此『施加两次结果相同』在跨调用层面也成立。"
    applies_to: [SPEC-IRP-002, SPEC-IRP-003]

  - id: DEC-006
    question: "模型不可用与模型输出非法，两种失败如何区分？"
    decision: "**模型不可用**（5xx / 超时 / 配额耗尽 / 网络错误）→ 走本地降级，返回 200 且 `data.degraded = true`；**模型输出非法**（不是 JSON / 不合 Schema）→ 返回 4xx MODEL_OUTPUT_INVALID，**绝不降级**"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "docs/backend-design.md §6.1 的降级链只写了『模型失败 → 降级』，没写『模型成功但输出是垃圾』。这两种情况在工程上必须分开：前者是**基础设施问题**，降级能给用户一个可用的结果；后者是**内容问题**，降级会用一段『看起来正常但与用户指令无关』的本地文案覆盖掉模型的实际输出，用户既没拿到模型的结果，也没被告知模型失败了 —— 而且非法输出里可能带着注入内容，降级等于把它静默洗白。已实现的口径：不可用 → degraded=true 的 200；非法 → MODEL_OUTPUT_INVALID 的 4xx。**这是对 §6.1 步骤 5 的显式偏离**，在此登记以便复核。"
    applies_to: [SPEC-API-004, SPEC-NFR-003]

  - id: DEC-007
    question: "路径参数形态非法（不是 UUID）时返回什么？"
    decision: "返回 404 NOT_FOUND —— **绝不返回 500**，也**不返回 400**"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "projects.id 等列是 Postgres 的 `uuid` 类型。把非 UUID 字符串塞进 `WHERE id = $1`，Postgres 在**类型转换**阶段抛错，异常一路冒到错误处理器就变成 500 —— 数据库实现细节被当成服务端的内部错误泄漏给了客户端。但 404 才是对的语义：路径里的 id 长得不像 UUID，就是『这个资源不存在』；403 会泄露『存在但你没权限』（SEC-08 明确禁止）；400 说的是『请求格式不对』，而这里请求格式完全合法，只是它指向的东西不存在。**先校验形态，再查库** —— 形态不对直接 404，根本不碰数据库。这个缺陷是被 E2E 打出来的：客户端用正则从 body 文本扒 jobId 时多截了一段中文，POST /api/exports/<乱码> 于是 500。回归锁见 apps/api/tests/security/resource-lifecycle.test.ts。"
    applies_to: [SPEC-API-001, SPEC-API-003]

  - id: DEC-008
    question: "软删除的资源，读路径要不要过滤 deleted_at？"
    decision: "要 —— **每一个**资源读路径都必须带 `deleted_at IS NULL`，包括中间件，而不只是在 list / find 查询里"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "删除是**软删除**（打 deleted_at 时间戳）。最初只有 listProjects / findProject 带了过滤，`requireProject` 中间件漏了，于是出现『作品库里没有了，直链却还能读能改』—— 列表与详情对同一个资源给出互相矛盾的答案。这类缺陷只有在**端到端**跑真实删除流程时才会暴露：单元测试从不断言『删掉之后再访问』这个状态转移。回归锁见 apps/api/tests/security/resource-lifecycle.test.ts（软删除后详情 / 子资源 / 写操作一律 404，且列表里不再出现）。"
    applies_to: [SPEC-API-003]

  - id: DEC-009
    question: "覆盖率门禁按目录聚合时，用 text 报告还是 lcov 报告？"
    decision: "用 lcov 报告的 ΣLH / ΣLF 精确聚合，不用 text 表格"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "docs/testing-strategy.md §8 写的是『领域层行覆盖率 ≥ 90%』—— 这是**目录级**判据。Bun 的 text 报告只给每个文件的百分比，不给分子分母，于是目录聚合要么靠加权估算（各文件行数权重未知，结果不可复现），要么退化成『所有文件都 ≥ 90』（换了判据，更严但不是同一条）。lcov 给出标准的 LF（可执行行总数）与 LH（命中行数），聚合就是 ΣLH / ΣLF —— 精确、可复现、与 text 报告同源同一次运行。阈值仍是 90，写死在脚本里，没有环境变量可以调低；一个领域内核文件都没采到时按未通过处理（无法判定 ≠ 通过）。"
    applies_to: [SPEC-GOV-001]

  - id: DEC-010
    question: "前后端集成 E2E 该不该直连真实模型端点？"
    decision: "不直连 —— E2E 的模型端点指向**本地替身**（spec/verify/model-stub-server.ts），替身返回官方端点在占位 key 下的**原样** 400 响应体；E2E 因此恒定走「模型不可用 → 本地降级」这条路径"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "docs/testing-strategy.md §6.1 明写「默认离线：`bun test` 一律使用回放，不烧 API 额度」，docs/backend-design.md §13 的测试分层把「AI 离线 → 录制响应回放」列为独立一层 —— 直连官方端点**违反**了这两条。实测后果也不是「多烧点额度」而已：官方端点在同一台机器上既有 300ms 返回 400 的常态，也有 TLS 校验失败、整整 20s 连不上的时刻；而 E2E 里「生成大纲」那一步只等 60s，降级链的最坏耗时正好是 3 × 20s = 60s。**测试的等待上限等于被测实现的最坏值**，于是这条用例变成掷硬币 —— 一次失败的判据分不清是实现坏了还是外网抽风，证据就不成立。改走本地替身后模型调用在 0–7ms 内失败（不再是 60,756ms），一轮 E2E 约 10s。替身返回原样的 400 响应体，于是链路仍是「真 HTTP → 真 SDK → 真错误分类（400 不可重试）→ 真降级链 → 真本地生成」，被换掉的只有链路尽头那台机器。**结论的适用范围**：E2E 证明的是「模型不可用时前后端仍然集成正确」，不证明真实模型下的生成质量或延迟 —— 那两项由 apps/api/tests/ai/（FakeModelClient）与 apps/api/tests/perf/ 覆盖，同样不是真实模型；要验证真实模型只能去预发环境单独跑，不能进 `bun test`。"
    applies_to: [SPEC-E2E-001, SPEC-E2E-002, SPEC-E2E-003, SPEC-E2E-004, SPEC-E2E-005, SPEC-E2E-006, SPEC-E2E-007]

  - id: DEC-011
    question: "E2E 的前端 dev server 要不要开热重载与文件监听？"
    decision: "不开 —— E2E 的 vite 一律带 `DISABLE_HMR=true`（关掉 hmr 与文件监听）"
    decided_by: "spec 化执行者"
    decided_at: "2026-11-01"
    rationale: "vite 的 dev server 监听**整个项目根目录**，而 E2E 跑的时候根目录底下一直在变：PGlite 是文件数据库（每写一行都在改 `.data/e2e-pglite/**`）、导出产物落在 `.data/e2e-artifacts/`、浏览器证据落在 `spec/evidence/`、注入检查还会直接改源码。任何一次改动都可能让 vite 给页面发一次**整页重载**；页面一重载，React 的内存状态就没了，E2E 里「UI 操作 → 服务端存了什么」这条链子就断在中间。实测两次：一次让 AC-E2E-006 的「还原后」那一轮连挂 4 个用例（判为不合格），一次只是碰巧没炸。这个开关本来就是为「agent 改文件时页面乱闪」准备的（见 vite.config.ts 的注释）—— E2E 断言的是**服务端状态**，不测热重载，热重载对它是纯噪声。"
    applies_to: [SPEC-E2E-001, SPEC-E2E-002, SPEC-E2E-003, SPEC-E2E-004, SPEC-E2E-005, SPEC-E2E-006, SPEC-E2E-007]

