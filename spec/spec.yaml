  # ---- SPEC-GOV-001 覆盖率门槛 ----
  - id: SPEC-GOV-001
    title: 领域内核行覆盖率不低于 90%
    type: governance
    risk: medium
    status: active
    maturity: automated
    statement: "领域内核（@ppt/core）的行覆盖率必须不低于 90%，否则阻断发布"
    source:
      doc: "docs/testing-strategy.md"
      section: "§8 质量门禁指标"
      quote: "| 领域层行覆盖率 | ≥ 90% | `bun test --coverage` | 阻断 |"
    acceptance:
      - id: AC-GOV-001
        criterion: "断言领域内核目录（packages/core/src/engine/）的**聚合**行覆盖率 ≥ 90 —— 聚合口径为 lcov 的 ΣLH / ΣLF；断言一个领域内核文件都没采到时按未通过处理（无法判定 ≠ 通过）"
        oracle:
          tier: authoritative
          source: "docs/testing-strategy.md §8 —— 领域层行覆盖率 ≥ 90%，阻断"
          confidence: high
        verification:
          kind: test
          target: "scripts/check-coverage.check.ts::domain-coverage-threshold"
          command: "bun test ./scripts/check-coverage.check.ts"
          pass_when: "退出码 0（门禁脚本以退出码表达判定：0=覆盖率达标；非 0=测试未全过 / 未采到任何引擎文件 / 覆盖率不足）"
        maturity: automated

