    topic: AABB 碰撞的「10px 缓冲」是容差还是安全距
    clause_ref: SPEC-QLT-005
    question: "『卡片/层 AABB 碰撞检测（10px 缓冲）』有两种读法：(a) 10px 是容差 —— 重叠不超过 10px 不算碰撞；(b) 10px 是安全距 —— 两个盒子间距不足 10px 即算碰撞。两者在重叠 0~10px 与间隙 0~10px 区间结论相反。"
    impact: correctness
