  # ---- SPEC-E2E-012 外部资源不可达时应用仍能启动 ----
  #
  # 这条是被一次**真实事故**逼出来的：应用把 Google Fonts 的样式表挂在
  # <head> 里当渲染阻塞资源。渲染阻塞样式表一旦 pending，会连带**阻塞脚本执行** ——
  # 外部 CDN 不可达时 <script type="module"> 永远不跑，React 挂不上，整页白屏。
  #
  # 后果在测试里特别难看：不是"某条用例失败"，是**每条用例都卡在 page.goto 上**，
  # 最后以 180s 超时收场 —— 分不清是实现的锅还是外网的锅，判据直接失效。
  - id: SPEC-E2E-012
    title: 外部资源不可达时，应用外壳仍然起得来
    type: technical
    risk: high
    status: active
    maturity: automated
    statement: "浏览器端应用不得依赖外部网络才能启动：外部字体 CDN 之类的资源不可达时，应用外壳（登录表单）必须渲染出来，且 HTML 里不得存在会阻塞渲染的外部样式表"
    source:
      doc: "docs/backend-features.md"
      section: "§N 字体与渲染 TPL-12 / EXP-12"
      quote: "| TPL-12 | 字体资源托管 | P0 | S3 | Manrope / Plus Jakarta Sans / JetBrains Mono / Noto Sans SC 本地化，服务端渲染不依赖外网 |"
    derived_from: SPEC-RND-003
    inference: "文档要求的是**服务端渲染**不依赖外网（字体 vendored 进仓库，ADR-009）；本条把同一要求推到**浏览器端**：同一个产品，字体 CDN 不可达就白屏，等于把可用性押在一个自己控制不了的第三方上。推导的**边界**说清楚 —— docs/backend-features.md §N 明确「离线/内网部署版 …… 当前为云端 SaaS 假设」，所以本条**不**主张「完全离线部署」，只主张「外部资源不可达时应用仍能启动」这一条底线。判据的**可判定依据**是浏览器平台的形式化行为（HTML 规范：未完成的渲染阻塞样式表会延迟脚本执行），不是我们自己的口味。"
    acceptance:
      - id: AC-E2E-021
        criterion: "断言应用返回的 HTML 里，每一张**外部**样式表都不是渲染阻塞的（media 不匹配 screen/all，或 rel=preload 配 onload 切 rel）"
        oracle:
          tier: formal
          source: "HTML 平台的形式化约束 —— 浏览器只把「匹配当前媒体类型」的样式表算作渲染阻塞（docs/test-cases.md TC-EXP-001b 同源：服务端 SVG 产物不得含 fonts.googleapis.com 远程引用，ADR-009 vendored fonts）"
          confidence: high
        verification:
          kind: test
          target: "e2e/offline.e2e.ts::应用 HTML → 没有会阻塞渲染的外部样式表"
          command: "bun test ./e2e/offline.e2e.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

      - id: AC-E2E-022
        criterion: "把应用源以外的所有请求无限期挂起（模拟外网不可达），断言登录表单仍在 8 秒内可见，且确实存在处于挂起状态的外部请求（否则用例空洞）"
        oracle:
          tier: formal
          source: "浏览器平台的形式化行为（脚本执行被渲染阻塞样式表挡住 ⇒ 应用不挂载）＋ 观测判据（外壳是否出现）；**8 秒是工程阈值**（低于外部挂起窗口 20s、低于 page.goto 默认 30s），文档没有给这个数值 —— 它只保证「回归时会快速失败而不是挂死」"
          confidence: medium
        verification:
          kind: test
          target: "e2e/offline.e2e.ts::外部资源被挂起 → 外壳仍在 8 秒内渲染出来"
          command: "bun test ./e2e/offline.e2e.ts"
          pass_when: "退出码 0，且该用例未被 skip"
        maturity: automated

